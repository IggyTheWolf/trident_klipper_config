#===================================================================#
#  INCLUDES                                                         #
#  Uncomment adxl.cfg only while the USB ADXL345 is plugged in.     #
#===================================================================#
#[include adxl.cfg]
[include moonraker_obico_macros.cfg]
[include fluidd.cfg]
[include stealthburner_leds.cfg]
[include nozzle_scrub.cfg]
[include macros.cfg]
[include cw2.cfg]                   # extruder + hotend (Clockwork 2)

#===================================================================#
#  MCU                                                              #
#  BTT Octopus V1.1 - STM32F446, 12 MHz crystal, 32 KiB bootloader. #
#  Flashed as USB-to-CAN bridge (CAN on PD0/PD1, 1 Mbit).           #
#===================================================================#
[mcu]
canbus_uuid: 844419e24ade
# USB mode (rollback): swap canbus_uuid for these two lines
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_060018000E5053424E363620-if00
#restart_method: command

#===================================================================#
#  PRINTER                                                          #
#===================================================================#
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 9000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[input_shaper]
shaper_freq_x: 68.2
shaper_type_x: mzv
shaper_freq_y: 69.4
shaper_type_y: ei

#===================================================================#
#  X / Y STEPPERS                                                   #
#  0.9 degree motors, 300 mm build.                                 #
#===================================================================#
#--- B motor (left) - MOTOR_0, endstop DIAG_0 -----------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PG6
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--- A motor (right) - MOTOR_1, endstop DIAG_1 ----------------------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: PG9
position_min: 0
position_endstop: 310
position_max: 310
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#===================================================================#
#  Z STEPPERS                                                       #
#  TR8x4 leadscrews (rotation_distance 4). Homes on the Tap probe.  #
#===================================================================#
#--- Z0 front left - MOTOR_2 ----------------------------------------
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 4
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#--- Z1 rear center - MOTOR_3 ---------------------------------------
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#--- Z2 front right - MOTOR_4 ---------------------------------------
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#===================================================================#
#  EXTRUDER DRIVER                                                  #
#  MOTOR_6. The [extruder] section itself lives in cw2.cfg.         #
#===================================================================#
[tmc2209 extruder]
uart_pin: PE1
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#===================================================================#
#  HEATED BED                                                       #
#  SSR on HE1, thermistor on TB. PID values are in SAVE_CONFIG below.#
#===================================================================#
[heater_bed]
heater_pin: PA3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
max_power: 0.6              # ~0.4 W/cm2 to avoid warping the bed
min_temp: 0
max_temp: 120

#===================================================================#
#  TEMPERATURE SENSORS                                              #
#===================================================================#
[temperature_sensor enclosure_temp]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF5             # T1
min_temp: 0
max_temp: 100
gcode_id: C

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#===================================================================#
#  PROBE                                                            #
#  Voron Tap on DIAG_7. Z offset is in SAVE_CONFIG below.           #
#  activate_gcode keeps the nozzle at or below 150C while probing.  #
#===================================================================#
[probe]
pin: !PG15
x_offset: 0
y_offset: 0
speed: 3
lift_speed: 7
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.005
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% elif ACTUAL_TEMP > MAX_TEMP %}
        { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
    {% endif %}

#===================================================================#
#  FANS                                                             #
#===================================================================#
[fan]
pin: PA8                    # FAN0 - part cooling
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: PE5                    # FAN1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[controller_fan controller_fan]
pin: PD12                   # FAN2 - runs while the bed is on
kick_start_time: 0.5
heater: heater_bed
fan_speed: .75

[heater_fan exhaust_fan]
pin: PD13                   # FAN3 - runs once the bed passes 60C
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0

#===================================================================#
#  LIGHTS                                                           #
#  Case light on HE2. Use the CASELIGHT macro to change it.         #
#===================================================================#
[output_pin caselight]
pin: PB10
pwm: true
shutdown_value: 0
value: .75
cycle_time: 0.01

#===================================================================#
#  HOMING AND LEVELING                                              #
#===================================================================#
[idle_timeout]
timeout: 1800

[safe_z_home]
home_xy_position: 150,295
speed: 100
z_hop: 10

[z_tilt]
z_positions:
   -50, 15
   150, 345
   350, 15
points:
   30, 18
   150, 290
   270, 18
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 400
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 275, 275
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5
algorithm: bicubic
adaptive_margin: 0          # extra mm around the print area

#===================================================================#
#  DISPLAY                                                          #
#  BTT Mini12864 on EXP1 / EXP2.                                    #
#===================================================================#
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

