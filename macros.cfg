#=====================================================================#
#  MACROS                                                             #
#  Print start/end, purging, tuning, backup and resonance helpers.   #
#=====================================================================#

#---------------------------------------------------------------------
#  FLUIDD CLIENT SETTINGS   (fluidd.cfg links to ~/fluidd-config)
#  Pause uses the defaults: park max X/Y - 5 mm, lift 2 mm, retract 1 mm.
#---------------------------------------------------------------------
[gcode_macro _CLIENT_VARIABLE]
variable_park_at_cancel: True
variable_user_cancel_macro: "BED_MESH_CLEAR"
gcode:

#---------------------------------------------------------------------
#  PRINT START / END   (slicer: PRINT_START BED=.. EXTRUDER=..)
#---------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED|default(110)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(150)|int %}
    # Tap-safe nozzle temp for homing, cleaning and probing
    {% set PROBE_TEMP = 150 %}
    STATUS_HEATING
    M117 Heating bed...
    M190 S{BED}
    M109 S{PROBE_TEMP}
    STATUS_HOMING
    M117 Homing...
    G28
    STATUS_CLEANING
    CLEAN_NOZZLE
    STATUS_HOMING
    SET_NOZZLE_LEDS_ON
    G28 Z
    M117 Bed Tilt...
    STATUS_LEVELING
    Z_TILT_ADJUST
    STATUS_MESHING
    M117 Calibrating mesh...
    BED_MESH_CALIBRATE ADAPTIVE=1
    STATUS_PRINTING
    G92 E0
    G90
    G0 X5 Y0 F6000
    M117 Heating extruder...
    M109 S{EXTRUDER}
    G1 E20.0 F3600          ; prime filament
    PURGE_LINE
    G1 Z10.0 F600
    G92 E0
    G1 F9000
    M117

[gcode_macro PRINT_END]
gcode:
    # Safe anti-stringing move: 20 mm away from the part, 2 mm up
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    STATUS_READY
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    G92 E0
    G1 E-20.0 F3600         ; retract filament
    TURN_OFF_HEATERS
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600   ; park at rear
    M107
    M117
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

#---------------------------------------------------------------------
#  PURGING
#---------------------------------------------------------------------
[gcode_macro PURGE_LINE]
description: Bed-front purge line
gcode:
    M117 Purging...
    G0 Z0.4
    G91
    G1 X240 E60 F1200
    G1 Y1
    G1 Z2 E-.5 F3000        ; small retract to reduce stringing
    G92 E0
    G90

[gcode_macro PURGE_FILAMENT]
description: Purge at the brush, then clean. PURGE_FILAMENT PURGE_LEN=50 PURGE_TEMP=250
variable_purge_spd: 500     # mm/min
variable_purge_ret: 20      # mm retract after purging
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("Please home your axes!") }
    {% endif %}
    SAVE_GCODE_STATE NAME=purge_filament
    G90
    G1 X227 Y310
    M109 S{params.PURGE_TEMP|default(250)|float}
    M83
    G1 E{params.PURGE_LEN|default(50)|float} F{purge_spd}
    G1 E-{purge_ret} F{purge_spd * 5}
    M106 S255               ; cool the nozzle
    M109 S150
    M106 S0
    G92 E0
    CLEAN_NOZZLE
    RESTORE_GCODE_STATE NAME=purge_filament

#---------------------------------------------------------------------
#  LIGHTS
#---------------------------------------------------------------------
[gcode_macro CASELIGHT]
description: Case light brightness. CASELIGHT VALUE=0..1 (default 1)
gcode:
    SET_PIN PIN=caselight VALUE={params.VALUE|default(1)}

#---------------------------------------------------------------------
#  TUNING
#---------------------------------------------------------------------
[gcode_macro PID_EXTRUDER]
description: PID tune the hotend and save
gcode:
    {% set TARGET = params.TARGET|default(210)|int %}
    PID_CALIBRATE HEATER=extruder TARGET={TARGET}
    SAVE_CONFIG

[gcode_macro PID_BED]
description: PID tune the bed and save
gcode:
    {% set TARGET = params.TARGET|default(60)|int %}
    PID_CALIBRATE HEATER=heater_bed TARGET={TARGET}
    SAVE_CONFIG

[gcode_macro PA_CAL]
# Pressure advance test: prints 20 lines, PA rising by PA_STEP each line.
# PA_CAL BED=100 EXTRUDER=240 PA_START=0.03 PA_STEP=0.002 NZL=0.4
# Based on http://realdeuce.github.io/Voron/PA/pressure_advance.html
description: Tune Pressure Advance
gcode:
    {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
        { action_raise_error("Cannot do that while printing") }
    {% endif %}
    {% set BED = params.BED|default(109)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(244)|float %}
    {% set PA_START = params.PA_START|default(0.0)|float %}
    {% set PA_STEP = params.PA_STEP|default(0.005)|float %}
    {% set NZL = params.NZL|default(printer.configfile.config["extruder"]["nozzle_diameter"])|float %}
    {% set E20 = (0.1147475 * NZL) * 20 %}
    {% set E40 = (0.1147475 * NZL) * 40 %}
    {% set X_MID = printer.configfile.config["stepper_x"]["position_max"]|float / 2.0 %}
    {% set Y_MID = printer.configfile.config["stepper_y"]["position_max"]|float / 2.0 %}
    PRINT_START BED={BED} EXTRUDER={EXTRUDER}
    G21
    G90
    M83
    SET_VELOCITY_LIMIT ACCEL=3000 MINIMUM_CRUISE_RATIO=0.5
    G92 E0
    M106 S0
    # Reference line at the current PA (i = -6 puts it 30 mm below the first test line)
    {% for i in [-6] + range(20)|list %}
        {% if i >= 0 %}
            SET_PRESSURE_ADVANCE ADVANCE={PA_START + (i * PA_STEP)}
            M117 Testing Pressure Advance at: {PA_START + (i * PA_STEP)}
        {% endif %}
        G1 X{X_MID-40} Y{(Y_MID-35)+(5*i)} F30000
        G1 Z0.25 F300
        G1 E0.75 F1800
        G1 X{X_MID-20} Y{(Y_MID-35)+(5*i)} E{E20} F300
        G1 X{X_MID+20} Y{(Y_MID-35)+(5*i)} E{E40} F9000
        G1 X{X_MID+40} Y{(Y_MID-35)+(5*i)} E{E20} F300
        G1 E-0.75 F1800
        G1 Z1 F300
    {% endfor %}
    M117 Best line: PA = {PA_START} + (line * {PA_STEP})
    PRINT_END

#---------------------------------------------------------------------
#  GIT BACKUP   (pushes this folder to GitHub, see .autocommit.sh)
#---------------------------------------------------------------------
[gcode_macro GIT_BACKUP]
gcode:
    RUN_SHELL_COMMAND CMD=backup_cfg

[gcode_shell_command backup_cfg]
command: sh /home/pi/printer_data/config/.autocommit.sh
timeout: 30.
verbose: True

#---------------------------------------------------------------------
#  RESONANCE TESTING   (needs [include adxl.cfg] in printer.cfg)
#---------------------------------------------------------------------
[gcode_macro MEASURE_RESONANCE]
gcode:
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data

[gcode_macro GRAPH_RESONANCE]
gcode:
    RUN_SHELL_COMMAND CMD=graph_resonance

[gcode_shell_command graph_resonance]
command: sh /home/pi/printer_data/config/.graph_resonance.sh
timeout: 320.

[gcode_macro GENERATE_GRAPHS]
gcode:
    RUN_SHELL_COMMAND CMD=generate_graphs

[gcode_shell_command generate_graphs]
command: sh /home/pi/printer_data/config/.generate_graphs.sh
timeout: 320.
verbose: True

#---------------------------------------------------------------------
#  MISC
#---------------------------------------------------------------------
[exclude_object]
