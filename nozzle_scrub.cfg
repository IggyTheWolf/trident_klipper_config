#=====================================================================#
#  NOZZLE SCRUB                                                       #
#  Wipes the nozzle back and forth across the brush at the rear.     #
#  Based on the Decontaminator macro by Hernsl / Edwardyeeks.        #
#=====================================================================#

[gcode_macro CLEAN_NOZZLE]
variable_x_start: 186       # brush left edge
variable_x_end: 226         # brush right edge (186 + 40 mm brush)
variable_y: 310             # brush Y position
variable_wipes: 8           # full left/right passes
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("Please home your axes!") }
    {% endif %}
    SAVE_GCODE_STATE NAME=clean_nozzle
    SET_NOZZLE_LEDS_ON
    G90
    G1 X{x_end} F3000
    G1 Y{y}
    {% for i in range(wipes) %}
        G1 X{x_start} F9000
        G1 X{x_end}
    {% endfor %}
    M117 Cleaned!
    G1 X150 F3000
    RESTORE_GCODE_STATE NAME=clean_nozzle
