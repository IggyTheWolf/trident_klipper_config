#===================================================================#
#  TOOLHEAD: MELLOW FLY-SB2040 V2 (CAN)                             #
#  RP2040, Katapult bootloader, CAN on gpio4/gpio5 at 1 Mbit.       #
#  Stealthburner + CW2 (LGX Lite gears), ATC Semitec 104NT on TH0.  #
#===================================================================#

[mcu sb2040]
canbus_uuid: 257c6ddf94e3

[temperature_sensor sb2040]
sensor_type: temperature_mcu
sensor_mcu: sb2040
min_temp: 0
max_temp: 100

#--- Extruder: CW2 on LGX Lite gears ---------------------------------
[extruder]
step_pin: sb2040:gpio9
dir_pin: !sb2040:gpio10
enable_pin: !sb2040:gpio7
rotation_distance: 5.56     # calibrated; LGX Lite gears, ratio built in
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: sb2040:gpio6                # HE0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: sb2040:gpio27               # TH0 (PT1000 jumper off)
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 10
max_extrude_only_distance: 140.0

[tmc2209 extruder]
uart_pin: sb2040:gpio8
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#--- Fans ------------------------------------------------------------
[fan]
pin: sb2040:gpio13                      # FAN0 / PCF - part cooling
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: sb2040:gpio14                      # FAN1 / HEF
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#--- Accelerometer (on the board) -------------------------------------
[adxl345]
cs_pin: sb2040:gpio1
spi_software_sclk_pin: sb2040:gpio0
spi_software_mosi_pin: sb2040:gpio3
spi_software_miso_pin: sb2040:gpio2

[resonance_tester]
accel_chip: adxl345
probe_points: 150, 150, 50
